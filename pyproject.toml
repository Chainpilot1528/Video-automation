[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reckoning-pipeline"
version = "0.1.0"
description = "Evidence-led, rights-aware documentary production pipeline for Reckoning Self."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2024.2.2",  # trusted CA bundle for HTTPS (python.org builds ship none)
    "pydantic>=2.12,<3",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
pipeline = "reckoning_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
faulthandler_timeout = 240  # dump stacks if a test hangs (e.g. a stuck FFmpeg)
