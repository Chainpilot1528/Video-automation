<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#14161a"/>
<text x="160" y="200" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#f2efe8" text-anchor="start">A claim is tracked separately from its source</text>
<rect x="160" y="420" width="440" height="260" rx="18" fill="none" stroke="#3a3d44" stroke-width="4"/>
<text x="380" y="540" font-family="Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#f2efe8" text-anchor="middle">Claim</text>
<text x="380" y="610" font-family="Helvetica, Arial, sans-serif" font-size="36" font-weight="400" fill="#9a968d" text-anchor="middle">what we say</text>
<line x1="610" y1="550" x2="686" y2="550" stroke="#e0a33a" stroke-width="6"/>
<polygon points="710,550 680,534 680,566" fill="#e0a33a"/>
<rect x="720" y="420" width="440" height="260" rx="18" fill="none" stroke="#3a3d44" stroke-width="4"/>
<text x="940" y="540" font-family="Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#f2efe8" text-anchor="middle">Source</text>
<text x="940" y="610" font-family="Helvetica, Arial, sans-serif" font-size="36" font-weight="400" fill="#9a968d" text-anchor="middle">where it comes from</text>
<line x1="1170" y1="550" x2="1246" y2="550" stroke="#e0a33a" stroke-width="6"/>
<polygon points="1270,550 1240,534 1240,566" fill="#e0a33a"/>
<rect x="1280" y="420" width="440" height="260" rx="18" fill="none" stroke="#e0a33a" stroke-width="4"/>
<text x="1500" y="540" font-family="Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#f2efe8" text-anchor="middle">Review</text>
<text x="1500" y="610" font-family="Helvetica, Arial, sans-serif" font-size="36" font-weight="400" fill="#9a968d" text-anchor="middle">a named person checks</text>
<text x="160" y="860" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="400" fill="#9a968d" text-anchor="start">Status starts as  unverified  until a human records a review.</text>
</svg>
